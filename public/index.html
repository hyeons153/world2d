<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#242f28">
    <meta name="description" content="친구들과 함께 뛰어노는 작은 픽셀 놀이터.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>픽셀 공터</title>
    <link rel="icon" href="./sprout.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <span class="brand"><img src="./sprout.svg" alt="" width="22" height="22">픽셀 공터</span>
        <div class="header-controls">
          <select class="background-select" id="background-select" aria-label="맵 배경">
            <option value="original">기존 배경</option>
            <option value="white">화이트</option>
            <option value="black">블랙</option>
          </select>
          <button type="button" class="auto-move-button" id="auto-move" aria-pressed="true" hidden>자동이동 <span aria-hidden="true">ON</span></button>
          <button type="button" class="pip-button" id="pip" aria-label="PiP 켜기" title="PiP 켜기" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="6" height="5" rx=".6"></rect></svg>
          </button>
        </div>
      </div>
    </header>
    <main class="container">
      <div class="layout">
        <section class="playground" aria-label="픽셀 공터 화면">
          <div class="scene-surface">
            <canvas id="scene" width="384" height="216" aria-label="픽셀 공터"></canvas>
            <p id="connection-message" class="game-message connection-message" role="status" hidden></p>
            <p id="play-message" class="game-message play-message" role="status" hidden></p>
          </div>
          <div id="touch" class="touch" aria-label="터치 조작" hidden>
            <div>
              <button type="button" data-key="1" aria-label="왼쪽 이동">←</button>
              <button type="button" data-key="2" aria-label="오른쪽 이동">→</button>
            </div>
            <button type="button" data-key="4" aria-label="점프">↑ 점프</button>
          </div>
        </section>
        <form class="entry" id="entry" aria-label="공터 입장">
          <label class="field-label" for="nickname">닉네임</label>
          <input id="nickname" name="nickname" maxlength="24" autocomplete="nickname" required>
          <fieldset class="character-field">
            <legend>캐릭터 선택</legend>
            <div class="characters" id="characters"></div>
          </fieldset>
          <div class="upload">
            <button class="upload-button" id="choose-file" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"></path></svg>
              내 PNG 등록
            </button>
            <input id="file" type="file" accept=".png,image/png" hidden>
            <label class="sheet-toggle" title="대기, 걷기 1, 걷기 2, 점프 순서로 정사각형 4칸을 가로로 배열하세요."><input id="sprite-sheet" type="checkbox"> 4컷 스프라이트</label>
          </div>
          <p id="entry-message" class="message" role="status" hidden></p>
          <button id="join" class="join" type="submit">입장하기</button>
        </form>
      </div>
    </main>
  </body>
</html>
