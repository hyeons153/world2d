<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#242f28">
    <meta name="description" content="친구들과 함께 뛰어노는 작은 픽셀 놀이터.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>픽셀 공터</title>
    <link rel="icon" href="./sprout.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="container header-content">
        <a class="brand" href="./">
          <img src="./sprout.svg" width="33" height="33" alt="">
          <span>픽셀 공터</span>
        </a>
        <div class="top-actions">
          <span id="connection" class="status" aria-live="polite" hidden><i aria-hidden="true"></i><span id="connection-text">연결 중</span></span>
          <button type="button" class="pip-button" id="pip" hidden>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="6" height="5" rx=".6"></rect></svg>
            <span>PiP 켜기</span>
          </button>
        </div>
      </div>
    </header>
    <main class="container">
      <section id="intro" class="intro">
        <h1>우리들의 작은<br class="small-only"> 픽셀 공터</h1>
        <p>캐릭터를 골라 친구들이 뛰어노는 공터로 들어가 보세요.</p>
      </section>
      <div id="layout" class="layout">
        <section class="playground" aria-label="픽셀 공터 화면">
          <div class="scene-top">
            <span class="scene-label"><i aria-hidden="true"></i><span id="scene-label">공터 미리보기</span></span>
            <span class="scene-meta" id="scene-meta"></span>
          </div>
          <div class="scene-surface" id="scene-surface">
            <canvas id="scene" width="384" height="216" aria-label="고정된 크기의 2D 픽셀 공터"></canvas>
          </div>
          <div class="scene-footer">
            <div class="desktop-hint"><span><kbd>←</kbd><kbd>→</kbd> 이동</span><span><kbd>Space</kbd> 점프</span></div>
            <span class="scene-note" id="scene-note">가만히 있어도 캐릭터가 움직여요.</span>
          </div>
          <div id="touch" class="touch" aria-label="터치 조작" hidden>
            <div>
              <button type="button" data-key="1" aria-label="왼쪽 이동">←</button>
              <button type="button" data-key="2" aria-label="오른쪽 이동">→</button>
            </div>
            <button type="button" data-key="4" aria-label="점프">↑ 점프</button>
          </div>
        </section>
        <form class="entry" id="entry">
          <h2>공터에 입장</h2>
          <label class="field-label" for="nickname">닉네임</label>
          <input id="nickname" name="nickname" placeholder="공터에서 사용할 이름" maxlength="24" autocomplete="nickname" required>
          <fieldset class="character-field">
            <legend>캐릭터 선택</legend>
            <div class="characters" id="characters"></div>
          </fieldset>
          <div class="upload">
            <button class="upload-button" id="choose-file" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"></path></svg>
              내 PNG 등록
            </button>
            <input id="file" type="file" accept=".png,image/png" hidden>
            <label class="sheet-toggle" title="대기, 걷기 1, 걷기 2, 점프 순서로 정사각형 4칸을 가로로 배열하세요."><input id="sprite-sheet" type="checkbox"> 4컷 스프라이트</label>
          </div>
          <p id="entry-message" class="message" role="status" hidden></p>
          <button id="join" class="join" type="submit">입장하기 <span aria-hidden="true">→</span></button>
        </form>
      </div>
      <p id="play-message" class="play-message" role="status" hidden></p>
    </main>
  </body>
</html>
